<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout</title>
    <!-- jquery cdn link -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url("https://th.bing.com/th/id/OIP.Bd8OnqJELLEGTiNpOKn3owHaJQ?w=133&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7");
            background-size: cover;;
        }
        main{
            border:2px solid rgb(63, 64, 63);
            background-color: rgb(235, 235, 220);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            margin-top: 50px;;
            width: 500px;
            margin: 100px auto;
        }

        input{
            width:50%;
            height: 30px;;
        }

        .google{
            font-size: 30px;
            color: rgb(24, 145, 6);;
            margin-bottom: 10px;
            outline: none;
        }

        .login-signup button{
            padding: 5px 10px;
            font-size: 20px;;
            border-radius: 5px;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }


        
        button{
            padding:5px 10px;
            cursor: pointer;
            background-color: green;
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 5px;
        }

        form{
            margin-bottom: 20px;;
        }

        .payment-form{
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="google">Cart Items</div>
        <form class="checkout-form">
            <img src="https://th.bing.com/th/id/OIP.Bd8OnqJELLEGTiNpOKn3owHaJQ?w=133&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="">
            <img src="https://th.bing.com/th/id/OIP.Bd8OnqJELLEGTiNpOKn3owHaJQ?w=133&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="">
            <br/>
            <button>Checkout</button>
        </form>
        <form class="payment-form">
            <input type="text" placeholder="enter card number" ><br/>
            <input type="text" placeholder="enter cvv" ><br/>
            <button>Pay</button>
        </form>

    </main>

    <script>
        $(document).ready(function(){
           $(".checkout-form").click(function(e){
                e.preventDefault(); //just from stopping it from refreshing

                $(".payment-form").show();
                $(".checkout-form").hide();
           })

           $(".payment-form").click(function(e){
                e.preventDefault();
           })
            
        })
    </script>
</body>
</html>
